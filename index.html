<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小游戏合集 · Game Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <h1>🎮 小游戏合集</h1>
    <p>即点即玩,无需下载</p>
  </header>

  <main class="game-grid">
    <!-- 第一个游戏:保卫萝卜(塔防) -->
    <a class="game-card" href="games/carrot-defense/">
      <div class="game-cover cover-carrot">🥕</div>
      <div class="game-info">
        <h2>保卫萝卜</h2>
        <p>在路边建箭塔和炮塔,挡住一波波怪物,别让萝卜被吃掉!</p>
        <span class="play-btn">开始游戏 →</span>
      </div>
    </a>

    <!-- 以后新增游戏就照着上面这张卡片复制一份 -->

    <div class="game-card coming-soon">
      <div class="game-cover">🔮</div>
      <div class="game-info">
        <h2>敬请期待</h2>
        <p>合成大西瓜、2048、贪吃蛇……更多游戏制作中</p>
      </div>
    </div>
  </main>

  <footer class="footer">用 HTML + JavaScript + 物理引擎制作 · 部署在互联网上</footer>
</body>
</html>
